[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "pytest-asyncio>=0.21.0",
]

[project]
name = "vox-cron-ai"
version = "1.0.0"
description = "Simple FastAPI Autopilot Response System"
authors = [
    { name = "Vox AI Team", email = "admin@vox-ai.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # Core FastAPI dependencies
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Database and HTTP
    "supabase>=2.0.0",
    "httpx>=0.25.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pytz>=2023.3",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
